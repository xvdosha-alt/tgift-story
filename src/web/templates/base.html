<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lost Gifts{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --bg-elevated: #0f1624;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --success: #22c55e;
      --radius: 16px;
      --shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.12), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(99,102,241,0.10), transparent 28%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
      pointer-events: none;
      z-index: 0;
    }
    .shell {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .brand-title { font-weight: 700; font-size: 1.05rem; }
    .brand-sub { color: var(--muted); font-size: 0.8rem; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .btn-ghost {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .muted { color: var(--muted); }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    {% block extra_css %}{% endblock %}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="bg-grid"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <div class="brand-mark">LG</div>
        <div>
          <div class="brand-title">Lost Gifts</div>
          <div class="brand-sub">NFT gift tracker</div>
        </div>
      </a>
      <a class="nav-link" href="https://t.me/" target="_blank" rel="noopener">Telegram Bot</a>
    </header>
    {% block content %}{% endblock %}
    <div class="footer">lostgifts.ru · xv_</div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
