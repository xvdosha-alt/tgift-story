map $http_upgrade $connection_upgrade_lostgifts {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lostgifts.ru www.lostgifts.ru;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://lostgifts.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lostgifts.ru;

    include /etc/nginx/snippets/cloudflare-allow.conf;
    ssl_certificate     /etc/letsencrypt/live/lostgifts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostgifts.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://lostgifts.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lostgifts.ru;

    include /etc/nginx/snippets/cloudflare-allow.conf;
    ssl_certificate     /etc/letsencrypt/live/lostgifts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostgifts.ru/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_lostgifts;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8877;
    }
}
